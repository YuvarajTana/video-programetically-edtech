name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # One install at the workspace root links every package. better-sqlite3
      # is declared by exactly one package so only one native build happens.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # tsconfig paths make every package visible to every other, so the
      # compiler cannot enforce the dependency graph; this does.
      - name: Package boundaries
        run: npm run deps:check

      - name: Unit tests
        run: npm test

      - name: Build studio app
        run: npm run app:build

      # Spec validation reads the registries directly — no bundling or browser.
      - name: Validate all specs and style guides
        run: npm run validate -- --studio
