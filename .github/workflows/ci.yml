name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Spec loading relies on Node's native TypeScript type stripping (22.18+).
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Spec validation reads the registries directly — no bundling or browser.
      - name: Validate all specs and style guides
        run: npm run validate -- --studio
